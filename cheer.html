<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>응원!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gugi&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cheer-text {
            text-align: center;
            white-space: nowrap;
            padding: 20px;
        }

        /* 네온 효과 */
        .neon {
            text-shadow: 
                0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 40px currentColor,
                0 0 80px currentColor;
        }

        /* 깜빡임 효과 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blink {
            animation: blink 1s ease-in-out infinite;
        }

        /* 슬라이드 효과 */
        @keyframes slideMove {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .slide-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .slide {
            white-space: nowrap;
            animation: slideMove 12s linear infinite;
            padding-left: 100vw;
        }

        /* 뒤로가기 버튼 */
        .back-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Jua', sans-serif;
        }
    </style>
</head>
<body>
    <div id="cheerContainer"></div>
    <div class="back-hint">👆 화면을 터치하면 돌아갑니다</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = params.get('msg') || '응원 문구!';
        const bgcolor = params.get('bg') || '#000000';
        const font = params.get('font') || 'Black Han Sans';
        const neon = params.get('neon') === 'true';
        const slide = params.get('slide') === 'true';
        const blink = params.get('blink') === 'true';

        // 배경색 설정
        document.body.style.backgroundColor = bgcolor;

        // 글자색 설정 (배경이 흰색이면 검정색)
        const textColor = bgcolor === '#ffffff' ? '#000000' : '#ffffff';

        const container = document.getElementById('cheerContainer');

        if (slide) {
            // 슬라이드 모드
            container.className = 'slide-container';
            container.innerHTML = `<div class="cheer-text slide ${neon ? 'neon' : ''} ${blink ? 'blink' : ''}">${message}</div>`;
            const textEl = container.querySelector('.cheer-text');
            textEl.style.fontFamily = `'${font}', sans-serif`;
            textEl.style.color = textColor;
            textEl.style.fontSize = '20vh';  // 화면 높이의 20%
        } else {
            // 일반 모드 - 화면에 꽉 차게
            container.innerHTML = `<div class="cheer-text ${neon ? 'neon' : ''} ${blink ? 'blink' : ''}">${message}</div>`;
            const textEl = container.querySelector('.cheer-text');
            textEl.style.fontFamily = `'${font}', sans-serif`;
            textEl.style.color = textColor;

            // 글씨 크기 자동 조절
            function adjustFontSize() {
                const maxWidth = window.innerWidth * 0.9;
                const maxHeight = window.innerHeight * 0.7;
                let fontSize = 500;

                textEl.style.fontSize = fontSize + 'px';

                while ((textEl.scrollWidth > maxWidth || textEl.scrollHeight > maxHeight) && fontSize > 20) {
                    fontSize -= 5;
                    textEl.style.fontSize = fontSize + 'px';
                }
            }

            adjustFontSize();
            window.addEventListener('resize', adjustFontSize);
        }

        // 전체화면 시도
        function tryFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
        }
        tryFullscreen();

        // 화면 꺼짐 방지
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }
        keepAwake();

        // 터치/클릭 시 뒤로가기
        document.body.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
