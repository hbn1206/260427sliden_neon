<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📣 응원 문구 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gugi&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffd700;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            margin-bottom: 10px;
            font-family: 'Jua', sans-serif;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
        .btn-start {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            border: none;
            border-radius: 15px;
            color: white;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .btn-start:hover {
            transform: scale(1.05);
        }
        .btn-start:active {
            transform: scale(0.95);
        }
        .color-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.selected {
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📣 응원 문구 생성기</h1>

        <div class="section">
            <div class="section-title">✏️ 응원 문구</div>
            <select id="presetSelect">
                <option value="">-- 문구 선택 --</option>
                <option value="화이팅! 💪">화이팅! 💪</option>
                <option value="최고! 🏆">최고! 🏆</option>
                <option value="대박! 🎉">대박! 🎉</option>
                <option value="파이팅! 🔥">파이팅! 🔥</option>
                <option value="응원해요! ❤️">응원해요! ❤️</option>
                <option value="할 수 있다! 💪">할 수 있다! 💪</option>
                <option value="custom">직접 입력</option>
            </select>
            <input type="text" id="customText" placeholder="직접 입력하세요..." style="display:none;">
        </div>

        <div class="section">
            <div class="section-title">🎨 배경색</div>
            <div class="color-options">
                <button class="color-btn selected" data-color="#000000" style="background:#000000;"></button>
                <button class="color-btn" data-color="#1a1a2e" style="background:#1a1a2e;"></button>
                <button class="color-btn" data-color="#ff0000" style="background:#ff0000;"></button>
                <button class="color-btn" data-color="#0000ff" style="background:#0000ff;"></button>
                <button class="color-btn" data-color="#006400" style="background:#006400;"></button>
                <button class="color-btn" data-color="#ff69b4" style="background:#ff69b4;"></button>
                <button class="color-btn" data-color="#ffd700" style="background:#ffd700;"></button>
                <button class="color-btn" data-color="#ffffff" style="background:#ffffff;"></button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🔤 글꼴</div>
            <select id="fontSelect">
                <option value="Black Han Sans">Black Han Sans (굵은 고딕)</option>
                <option value="Jua">Jua (둥근 고딕)</option>
                <option value="Do Hyeon">Do Hyeon (네모 고딕)</option>
                <option value="Gugi">Gugi (독특한 고딕)</option>
            </select>
        </div>

        <div class="section">
            <div class="section-title">✨ 효과</div>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="neonEffect">
                    <span>💡 네온싸인 효과</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="slideEffect">
                    <span>🎬 슬라이드 효과</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="blinkEffect">
                    <span>⚡ 깜빡깜빡 효과</span>
                </label>
            </div>
        </div>

        <button class="btn-start" onclick="startCheer()">🚀 전체화면 시작!</button>
    </div>

    <script>
        let selectedColor = '#000000';

        // 페이지 로드 시 저장된 옵션 복원
        window.onload = function() {
            // 문구 복원
            const savedSelected = localStorage.getItem('cheer_selected');
            const savedCustom = localStorage.getItem('cheer_custom');
            if (savedSelected) {
                document.getElementById('presetSelect').value = savedSelected;
                if (savedSelected === 'custom') {
                    document.getElementById('customText').style.display = 'block';
                    if (savedCustom) {
                        document.getElementById('customText').value = savedCustom;
                    }
                }
            }

            // 배경색 복원
            const savedBgColor = localStorage.getItem('cheer_bgcolor');
            if (savedBgColor) {
                selectedColor = savedBgColor;
                document.querySelectorAll('.color-btn').forEach(btn => {
                    btn.classList.remove('selected');
                    if (btn.dataset.color === savedBgColor) {
                        btn.classList.add('selected');
                    }
                });
            }

            // 글꼴 복원
            const savedFont = localStorage.getItem('cheer_font');
            if (savedFont) {
                document.getElementById('fontSelect').value = savedFont;
            }

            // 효과 복원
            if (localStorage.getItem('cheer_neon') === 'true') {
                document.getElementById('neonEffect').checked = true;
            }
            if (localStorage.getItem('cheer_slide') === 'true') {
                document.getElementById('slideEffect').checked = true;
            }
            if (localStorage.getItem('cheer_blink') === 'true') {
                document.getElementById('blinkEffect').checked = true;
            }
        };

        // 문구 선택 변경 시 저장
        document.getElementById('presetSelect').addEventListener('change', function() {
            localStorage.setItem('cheer_selected', this.value);
            if (this.value === 'custom') {
                document.getElementById('customText').style.display = 'block';
            } else {
                document.getElementById('customText').style.display = 'none';
            }
        });

        // 직접 입력 변경 시 저장
        document.getElementById('customText').addEventListener('input', function() {
            localStorage.setItem('cheer_custom', this.value);
        });

        // 글꼴 변경 시 저장
        document.getElementById('fontSelect').addEventListener('change', function() {
            localStorage.setItem('cheer_font', this.value);
        });

        // 효과 변경 시 저장
        document.getElementById('neonEffect').addEventListener('change', function() {
            localStorage.setItem('cheer_neon', this.checked);
        });
        document.getElementById('slideEffect').addEventListener('change', function() {
            localStorage.setItem('cheer_slide', this.checked);
        });
        document.getElementById('blinkEffect').addEventListener('change', function() {
            localStorage.setItem('cheer_blink', this.checked);
        });

        // 배경색 선택
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.dataset.color;
                localStorage.setItem('cheer_bgcolor', selectedColor);
            });
        });

        function startCheer() {
            const presetSelect = document.getElementById('presetSelect');
            const customText = document.getElementById('customText');
            const fontSelect = document.getElementById('fontSelect');
            const neonEffect = document.getElementById('neonEffect').checked;
            const slideEffect = document.getElementById('slideEffect').checked;
            const blinkEffect = document.getElementById('blinkEffect').checked;

            let text = '';
            if (presetSelect.value === 'custom') {
                text = customText.value.trim();
            } else {
                text = presetSelect.value;
            }

            if (!text) {
                alert('응원 문구를 입력해주세요!');
                return;
            }

            const params = new URLSearchParams({
                text: text,
                bgcolor: selectedColor,
                font: fontSelect.value,
                neon: neonEffect,
                slide: slideEffect,
                blink: blinkEffect
            });

            window.location.href = 'cheer.html?' + params.toString();
        }
    </script>
</body>
</html>
