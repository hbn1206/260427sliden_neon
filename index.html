<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>📣 응원 문구 LED</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    background: #0b0f1a; color: #fff;
    overscroll-behavior: none;
  }
  body { min-height: 100vh; min-height: 100dvh; }

  /* ===== 설정 화면 ===== */
  #setup {
    padding: 16px 14px 40px;
    max-width: 560px; margin: 0 auto;
  }
  h1 {
    font-size: 22px; margin: 8px 0 14px;
    text-align: center;
    background: linear-gradient(90deg,#ff5e7e,#ffd166,#06d6a0,#4cc9f0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .group { margin-bottom: 16px; }
  .label { font-size: 13px; color: #9aa4bf; margin-bottom: 8px; font-weight:600;}

  /* 분임 선택 */
  .tabs { display: flex; gap: 8px; }
  .tab {
    flex: 1; padding: 12px 8px; border-radius: 12px;
    background: #1a2238; color: #cfd5e8; font-weight: 700; font-size: 14px;
    border: 2px solid transparent; text-align: center; cursor: pointer;
    transition: all .2s;
  }
  .tab.active { background: linear-gradient(135deg,#4cc9f0,#7209b7); color:#fff; border-color:#fff3;}

  /* 예시 문구 */
  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ex {
    background: #151c30; border: 1px solid #232b47;
    color: #e7ecf8; padding: 12px 10px; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    text-align: center; min-height: 64px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .1s;
  }
  .ex:active { transform: scale(0.97); background:#1f2848;}

  /* 텍스트 입력 */
  textarea {
    width: 100%; min-height: 70px; resize: vertical;
    background: #0f1426; color:#fff; border: 1px solid #2a335a;
    border-radius: 12px; padding: 12px; font-size: 16px;
    font-family: inherit;
  }

  /* 옵션 행 */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt label { font-size: 12px; color:#9aa4bf; display:block; margin-bottom:4px;}
  .opt select, .opt input[type="color"] {
    width:100%; padding:10px; border-radius:10px;
    background:#0f1426; color:#fff; border:1px solid #2a335a;
    font-size: 14px;
  }
  .opt input[type="color"] { height: 42px; padding: 4px; }

  /* 미리보기 */
  .preview {
    margin-top: 6px;
    height: 140px; border-radius: 14px; overflow: hidden;
    background: #000; border: 1px solid #2a335a;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .preview .pv-text {
    font-weight: 900; white-space: nowrap;
    letter-spacing: 1px;
  }

  /* 버튼 */
  .go {
    margin-top: 14px; width: 100%; padding: 16px;
    border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(90deg,#ff006e,#fb5607,#ffbe0b);
    color:#fff; font-size: 18px; font-weight: 800;
    box-shadow: 0 8px 24px #ff006e44;
  }
  .hint { text-align:center; color:#7d87a6; font-size:12px; margin-top:8px;}

  /* ===== 전체화면 모드 ===== */
  #stage {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000; overflow: hidden; z-index: 9999;
  }
  #stage.on { display: flex; }
  #stage .marquee {
    white-space: nowrap;
    font-weight: 900;
    will-change: transform;
    line-height: 1;
  }
  /* 흐름 애니메이션 */
  @keyframes scrollLeft {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }
  /* 깜빡임 */
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%,100% { opacity: 0.15; }
  }
  /* 무지개 */
  @keyframes rainbow {
    0%{color:#ff0066} 16%{color:#ff9900} 33%{color:#ffee00}
    50%{color:#33ff66} 66%{color:#33ccff} 83%{color:#cc66ff} 100%{color:#ff0066}
  }
  .exit-tip {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #ffffff44;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>📣 응원 문구 LED</h1>

  <div class="group">
    <div class="label">1️⃣ 분임 선택</div>
    <div class="tabs">
      <div class="tab active" data-team="edu">에듀테크AI(고) 분임</div>
      <div class="tab" data-team="math">수학 분임</div>
    </div>
  </div>

  <div class="group">
    <div class="label">2️⃣ 예시 문구 (탭하여 선택)</div>
    <div class="examples" id="examples"></div>
  </div>

  <div class="group">
    <div class="label">3️⃣ 직접 입력</div>
    <textarea id="msg" placeholder="응원 문구를 입력하세요!"></textarea>
  </div>

  <div class="group">
    <div class="label">4️⃣ 옵션</div>
    <div class="row">
      <div class="opt">
        <label>글자색</label>
        <input type="color" id="fg" value="#ffe600">
      </div>
      <div class="opt">
        <label>배경색</label>
        <input type="color" id="bg" value="#000000">
      </div>
    </div>
    <div class="row" style="margin-top:8px;">
      <div class="opt">
        <label>효과</label>
        <select id="effect">
          <option value="scroll">흐르기 (LED)</option>
          <option value="blink">깜빡임</option>
          <option value="rainbow">무지개</option>
          <option value="static">고정</option>
        </select>
      </div>
      <div class="opt">
        <label>속도</label>
        <select id="speed">
          <option value="14">느리게</option>
          <option value="9" selected>보통</option>
          <option value="5">빠르게</option>
        </select>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="label">5️⃣ 미리보기</div>
    <div class="preview" id="preview">
      <div class="pv-text" id="pvText">응원 문구를 선택하거나 입력하세요</div>
    </div>
  </div>

  <button class="go" id="goBtn">🚀 전체화면으로 보기</button>
  <div class="hint">전체화면에서 화면을 한번 탭하면 돌아옵니다 · 휴대폰을 가로로 돌리세요 📱↔️</div>
</div>

<!-- 전체화면 스테이지 -->
<div id="stage">
  <div class="marquee" id="marquee">텍스트</div>
  <div class="exit-tip">화면을 탭하면 종료됩니다</div>
</div>

<script>
/* ==== 데이터 ==== */
const PHRASES = {
  edu: [
    "에듀테크AI 최고! 🚀",
    "AI로 미래교육 선도! 💡",
    "열정만점 에듀테크 분임! 🔥",
    "혁신과 도전, 우리가 1등! 🏆"
  ],
  math: [
    "수학 분임 파이팅! ➕✖️",
    "문제는 풀라고 있는 것! 💯",
    "수학으로 세상을 풀다! 🧮",
    "끝까지 가즈아 수학 분임! 🚀"
  ]
};

/* ==== DOM ==== */
const $ = s => document.querySelector(s);
const tabs = document.querySelectorAll('.tab');
const exBox = $('#examples');
const msgEl = $('#msg');
const fgEl = $('#fg'), bgEl = $('#bg');
const effectEl = $('#effect'), speedEl = $('#speed');
const previewEl = $('#preview'), pvText = $('#pvText');
const stage = $('#stage'), marquee = $('#marquee');

let currentTeam = 'edu';

/* ==== 예시 문구 렌더 ==== */
function renderExamples(){
  exBox.innerHTML = '';
  PHRASES[currentTeam].forEach(t=>{
    const d = document.createElement('div');
    d.className = 'ex';
    d.textContent = t;
    d.onclick = ()=>{ msgEl.value = t; updatePreview(); };
    exBox.appendChild(d);
  });
}

/* ==== 분임 탭 ==== */
tabs.forEach(t=>{
  t.onclick = ()=>{
    tabs.forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentTeam = t.dataset.team;
    renderExamples();
  };
});

/* ==== 미리보기 ==== */
function fitFont(container, textEl, maxRatio=0.9){
  // 컨테이너 높이에 맞게 폰트 크기 조절
  textEl.style.fontSize = '20px';
  const cw = container.clientWidth, ch = container.clientHeight;
  let size = Math.floor(ch * maxRatio);
  textEl.style.fontSize = size + 'px';
  // 가로 너무 길면 줄임 (미리보기는 한 줄이라 자동 스크롤)
  return size;
}

function updatePreview(){
  const text = (msgEl.value || '응원 문구를 선택하거나 입력하세요').trim();
  pvText.textContent = text;
  pvText.style.color = fgEl.value;
  previewEl.style.background = bgEl.value;

  // 효과 적용 (미리보기에서도)
  pvText.style.animation = 'none';
  pvText.style.transform = '';
  // 폰트 크기
  fitFont(previewEl, pvText, 0.55);

  const eff = effectEl.value;
  const dur = parseFloat(speedEl.value);
  if(eff === 'scroll'){
    // 미리보기는 좁으니 작게 흐름
    pvText.style.animation = `scrollLeft ${dur}s linear infinite`;
  } else if(eff === 'blink'){
    pvText.style.animation = `blink 1s steps(2, end) infinite`;
  } else if(eff === 'rainbow'){
    pvText.style.animation = `rainbow 3s linear infinite`;
  }
}

[msgEl, fgEl, bgEl, effectEl, speedEl].forEach(el=>{
  el.addEventListener('input', updatePreview);
  el.addEventListener('change', updatePreview);
});

/* ==== 전체화면 ==== */
function fitStageFont(){
  // 화면 높이에 글씨가 꽉 차도록 (높이 기준)
  const h = window.innerHeight;
  // 95%
  marquee.style.fontSize = Math.floor(h * 0.85) + 'px';
}

function openStage(){
  const text = (msgEl.value || PHRASES[currentTeam][0]).trim();
  marquee.textContent = text;
  marquee.style.color = fgEl.value;
  stage.style.background = bgEl.value;

  // 폰트 크기 - 높이 꽉
  fitStageFont();

  // 효과
  marquee.style.animation = 'none';
  // reflow
  void marquee.offsetWidth;
  const eff = effectEl.value;
  const dur = parseFloat(speedEl.value);
  if(eff === 'scroll'){
    marquee.style.animation = `scrollLeft ${dur}s linear infinite`;
  } else if(eff === 'blink'){
    marquee.style.animation = `blink 0.8s steps(2,end) infinite`;
  } else if(eff === 'rainbow'){
    marquee.style.animation = `rainbow 3s linear infinite`;
  } else {
    marquee.style.animation = '';
  }

  stage.classList.add('on');

  // 진짜 fullscreen API 시도 (지원되는 기기에서)
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if(req){ try{ req.call(el); }catch(e){} }

  // 화면 깨우기 (선택)
  if('wakeLock' in navigator){
    try{ navigator.wakeLock.request('screen').then(l=>window._wl=l); }catch(e){}
  }
}

function closeStage(){
  stage.classList.remove('on');
  marquee.style.animation = 'none';
  if(document.fullscreenElement){
    try{ document.exitFullscreen(); }catch(e){}
  } else if(document.webkitFullscreenElement){
    try{ document.webkitExitFullscreen(); }catch(e){}
  }
  if(window._wl){ try{ window._wl.release(); }catch(e){} window._wl=null; }
}

$('#goBtn').onclick = openStage;
stage.addEventListener('click', closeStage);
stage.addEventListener('touchstart', e=>{ e.preventDefault(); closeStage(); }, {passive:false});

window.addEventListener('resize', ()=>{
  if(stage.classList.contains('on')) fitStageFont();
  updatePreview();
});
window.addEventListener('orientationchange', ()=>{
  setTimeout(()=>{ if(stage.classList.contains('on')) fitStageFont(); }, 200);
});

/* 초기화 */
renderExamples();
updatePreview();
</script>
</body>
</html>
