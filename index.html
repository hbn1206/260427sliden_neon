<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>분임 응원 LED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu:wght@700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@900&family=Gugi&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1020; --panel:#141a33; --line:#26305a; --text:#eef1ff; --muted:#9aa3c7;
    --accent:#7c5cff; --accent2:#22d3ee;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR','Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    overflow-x:hidden;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px;}
  h1{font-size:20px;margin:6px 0 14px;letter-spacing:-.5px;}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
  .seg{display:flex;background:#0f1530;border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;}
  .seg button{flex:1;background:transparent;color:var(--text);border:0;padding:10px 8px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .seg button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1020;}
  .examples{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .examples button{background:#0f1530;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px;font-size:14px;line-height:1.35;cursor:pointer;text-align:left;font-weight:600;}
  .examples button:active{transform:scale(.98);}
  textarea{width:100%;min-height:80px;background:#0f1530;color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:12px;font-size:15px;resize:vertical;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  select,input[type=color],input[type=range]{width:100%;background:#0f1530;color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;}
  input[type=color]{height:44px;padding:4px;}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;border:0;font-size:17px;font-weight:800;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1020;letter-spacing:.5px;}
  .btn:active{transform:scale(.99);}
  .preview{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);}
  .stage,.preview .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .text{white-space:pre-wrap;word-break:keep-all;text-align:center;line-height:1.05;font-weight:900;
    text-shadow:0 0 14px rgba(255,255,255,.12);padding:0 4px;}
  /* 흐르기: 단일 문구가 오른쪽 밖에서 시작해 왼쪽 밖으로 사라지고 2초 대기 후 반복 */
  .marquee{position:absolute;inset:0;display:flex;align-items:center;overflow:hidden;}
  .marquee .track{position:absolute;left:0;top:50%;transform:translate(100%,-50%);white-space:nowrap;
    animation:marquee var(--dur,12s) linear infinite;will-change:transform;font-weight:900;line-height:1;
    text-shadow:0 0 14px rgba(255,255,255,.12);}
  @keyframes marquee{
    0%   { transform: translate(100%,-50%); }    /* 오른쪽 화면 밖에서 시작 */
    var(--end,80%) { transform: translate(-100%,-50%); } /* 왼쪽 밖으로 사라짐 */
    100% { transform: translate(-100%,-50%); }   /* 2초 대기 (정지) */
  }
  /* 깜빡임 */
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.05} }
  .blink{animation:blink 1s steps(1) infinite;}
  /* 무지개 */
  @keyframes hue { from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
  .rainbow{animation:hue 4s linear infinite;
    background:linear-gradient(90deg,#ff5b6e,#ffb84d,#ffe14d,#7cf08a,#5bd1ff,#9b8cff,#ff7adf);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  /* 전체화면 무대 */
  #stage{position:fixed;inset:0;background:#000;z-index:9999;display:none;align-items:center;justify-content:center;overflow:hidden;}
  #stage.on{display:flex;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#0f1530;border:1px solid var(--line);color:var(--muted);}
  .footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;}
  /* 글꼴 클래스 */
  .f-noto{font-family:'Noto Sans KR',sans-serif;font-weight:900;}
  .f-blackhan{font-family:'Black Han Sans',sans-serif;}
  .f-dohyeon{font-family:'Do Hyeon',sans-serif;}
  .f-jua{font-family:'Jua',sans-serif;}
  .f-gaegu{font-family:'Gaegu',cursive;font-weight:700;}
  .f-pen{font-family:'Nanum Pen Script',cursive;}
  .f-gugi{font-family:'Gugi',cursive;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📣 <span>분임 응원 LED</span></h1>

  <div class="card">
    <label>분임 선택</label>
    <div class="seg" id="groupSeg">
      <button data-g="edutech" class="on">에듀테크AI(고)</button>
      <button data-g="math">수학</button>
    </div>
    <label style="margin-top:12px;">예시 문구 (탭하면 자동 입력)</label>
    <div class="examples" id="examples"></div>
  </div>

  <div class="card">
    <label>응원 문구 직접 입력</label>
    <textarea id="msg" placeholder="여기에 응원 문구를 입력하세요">에듀테크 AI 최고!!</textarea>
    <div class="hint">줄바꿈도 그대로 반영됩니다.</div>
  </div>

  <div class="card">
    <label>효과</label>
    <div class="seg" id="fxSeg">
      <button data-fx="flow" class="on">흐르기</button>
      <button data-fx="blink">깜빡임</button>
      <button data-fx="rainbow">무지개</button>
      <button data-fx="solid">고정</button>
    </div>

    <div class="grid2" style="margin-top:12px;">
      <div>
        <label>글자색</label>
        <input type="color" id="fg" value="#ffe14d" />
      </div>
      <div>
        <label>배경색</label>
        <input type="color" id="bg" value="#000000" />
      </div>
    </div>

    <div class="grid2" style="margin-top:10px;">
      <div>
        <label>글꼴</label>
        <select id="font">
          <option value="f-blackhan">Black Han Sans (굵직한 임팩트)</option>
          <option value="f-noto" selected>Noto Sans KR (깔끔한 굵은체)</option>
          <option value="f-dohyeon">Do Hyeon (둥근 고딕)</option>
          <option value="f-jua">Jua (귀여운 둥근체)</option>
          <option value="f-gugi">Gugi (강렬한 캘리)</option>
          <option value="f-gaegu">Gaegu (손글씨)</option>
          <option value="f-pen">Nanum Pen (펜글씨)</option>
        </select>
      </div>
      <div>
        <label>흐르기 속도 <span id="spdLbl" class="pill">보통</span></label>
        <input type="range" id="spd" min="1" max="5" value="3" />
      </div>
    </div>
  </div>

  <div class="card">
    <label>미리보기</label>
    <div class="preview" id="preview">
      <div class="inner" id="previewInner"></div>
    </div>
    <div class="pillrow" style="margin-top:8px;">
      <span class="pill">전체화면 시 글자 높이 ≈ 70%</span>
      <span class="pill">탭 한 번 → 복귀</span>
      <span class="pill">설정 자동 보존</span>
    </div>
  </div>

  <button class="btn" id="goFull">🚀 전체화면으로 보기</button>
  <div class="footer">github.io 등 정적 호스팅에 그대로 올려서 사용하세요.</div>
</div>

<div id="stage"><div id="stageInner" style="position:absolute;inset:0;"></div></div>

<script>
const EXAMPLES = {
  edutech: [
    "에듀테크 AI 최고!!",
    "AI로 여는 미래 교실, 에듀테크 파이팅!",
    "도전과 열정! 에듀테크AI(고) 분임 1등!",
    "코드 한 줄, 미래 한 걸음 🚀"
  ],
  math: [
    "수학은 즐거움! 수학 분임 화이팅!",
    "공식보다 빛나는 우리의 도전 ✨",
    "정답보다 멋진 풀이 과정! 수학 분임 최고!",
    "한 문제 한 문제, 함께라서 즐겁다!"
  ]
};

const $ = s => document.querySelector(s);
const state = {
  group: 'edutech',
  fx: 'flow',
  fg: '#ffe14d',
  bg: '#000000',
  font: 'f-noto',
  spd: 3,
  msg: '에듀테크 AI 최고!!'
};

// 분임 선택
$('#groupSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#groupSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  state.group = b.dataset.g;
  renderExamples();
});

function renderExamples(){
  const wrap = $('#examples');
  wrap.innerHTML = '';
  EXAMPLES[state.group].forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t;
    btn.addEventListener('click', ()=>{
      $('#msg').value = t;
      state.msg = t;
      updatePreview();
    });
    wrap.appendChild(btn);
  });
}
renderExamples();

// 효과
$('#fxSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#fxSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  state.fx = b.dataset.fx;
  updatePreview();
});

// 입력
$('#msg').addEventListener('input', e=>{ state.msg = e.target.value; updatePreview(); });
$('#fg').addEventListener('input', e=>{ state.fg = e.target.value; updatePreview(); });
$('#bg').addEventListener('input', e=>{ state.bg = e.target.value; updatePreview(); });
$('#font').addEventListener('change', e=>{ state.font = e.target.value; updatePreview(); });
$('#spd').addEventListener('input', e=>{
  state.spd = +e.target.value;
  const labels = ['','매우 느림','느림','보통','빠름','매우 빠름'];
  $('#spdLbl').textContent = labels[state.spd];
  updatePreview();
});

// 폰트 크기 이진 탐색 — 텍스트가 컨테이너 안에 들어가는 최대 크기
function fitFontSize(el, cw, ch, maxPx){
  let lo=10, hi=maxPx, best=10;
  while(lo<=hi){
    const mid = (lo+hi) >> 1;
    el.style.fontSize = mid + 'px';
    if (el.scrollWidth <= cw && el.scrollHeight <= ch){ best = mid; lo = mid+1; }
    else hi = mid-1;
  }
  el.style.fontSize = best + 'px';
  return best;
}

// 화면 렌더링 (미리보기 + 전체화면 공용)
function renderInto(container, isFull){
  const cw = container.clientWidth;
  const ch = container.clientHeight;
  if (cw === 0 || ch === 0) return;

  container.style.background = state.bg;
  container.innerHTML = '';

  const txt = state.msg || ' ';

  if (state.fx === 'flow'){
    // 한 줄로 합치기 (흐르기는 한 줄로 흐르는 것이 자연스러움)
    const oneLine = txt.replace(/\s*\n\s*/g,' ');

    const marquee = document.createElement('div');
    marquee.className = 'marquee';
    const track = document.createElement('div');
    track.className = 'track ' + state.font;
    track.textContent = oneLine;
    track.style.color = (state.fx==='rainbow' ? '' : state.fg);
    marquee.appendChild(track);
    container.appendChild(marquee);

    // 폰트 크기: 전체화면이면 높이의 70%, 미리보기는 60%
    const targetH = Math.floor(ch * (isFull ? 0.70 : 0.60));
    track.style.fontSize = targetH + 'px';

    // 속도 계산: 1=느림 ~ 5=빠름 (픽셀/초)
    const pxPerSec = [0, 80, 140, 220, 320, 460][state.spd];
    // 트랙 폭 측정
    const trackW = track.scrollWidth;
    // 이동 총 거리 = 트랙폭(오른쪽 밖→왼쪽 밖) + 무대폭 = trackW + cw
    // 그러나 keyframe 은 100%(=trackW) 만큼 이동 후 -100%(=다시 trackW). 실제 이동 거리 ≈ 2*trackW + cw 까진 아니고
    // translate(100%) → translate(-100%) 이므로 트랙 자체 기준 200% 이동 = 2 * trackW
    const moveDist = 2 * trackW;
    const moveSec = moveDist / pxPerSec;
    const pauseSec = 2; // 끝나고 2초 대기
    const totalSec = moveSec + pauseSec;
    const endPct = (moveSec / totalSec) * 100;

    // 동적 keyframes 주입 (퍼센트 변수 트릭 대신 직접 stylesheet 변경)
    const styleId = 'mq-style-' + (isFull ? 'full' : 'prev');
    let styleEl = document.getElementById(styleId);
    if (!styleEl){
      styleEl = document.createElement('style');
      styleEl.id = styleId;
      document.head.appendChild(styleEl);
    }
    const animName = 'marquee_' + (isFull?'full':'prev');
    styleEl.textContent = `
      @keyframes ${animName}{
        0% { transform: translate(100%,-50%); }
        ${endPct.toFixed(3)}% { transform: translate(-100%,-50%); }
        100% { transform: translate(-100%,-50%); }
      }`;
    track.style.animation = `${animName} ${totalSec.toFixed(2)}s linear infinite`;
  }
  else {
    // 깜빡임 / 무지개 / 고정 — 텍스트가 화면 안에 모두 보이도록 폰트 크기 자동 산정
    const inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2%;';
    const span = document.createElement('div');
    span.className = 'text ' + state.font;
    if (state.fx === 'rainbow') span.classList.add('rainbow');
    else span.style.color = state.fg;
    if (state.fx === 'blink') span.classList.add('blink');
    span.textContent = txt;
    inner.appendChild(span);
    container.appendChild(inner);

    // 사용 가능 영역
    const padW = cw * 0.04;
    const padH = ch * 0.04;
    const availW = cw - padW;
    const availH = ch - padH;

    // 전체화면이면 글자 높이 70%를 우선 시도, 안 되면 줄여서라도 다 보이게
    const targetMax = Math.floor( (isFull ? availH * 1.0 : availH) ); // 상한
    const fitted = fitFontSize(span, availW, availH, targetMax);

    // 전체화면일 때 한 줄짜리 문구라면 70% 높이를 강제 적용 (다 보이는 한도 내)
    if (isFull && !/\n/.test(txt)){
      const target70 = Math.floor(ch * 0.70);
      // 70% 적용해도 가로/세로 안에 들어가는지 검사
      span.style.fontSize = target70 + 'px';
      if (span.scrollWidth > availW || span.scrollHeight > availH){
        span.style.fontSize = fitted + 'px'; // 못 들어가면 fit 값 사용
      }
    }
  }
}

function updatePreview(){
  renderInto($('#previewInner'), false);
}

// 전체화면
let wakeLock = null;
async function requestWake(){
  try{
    if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWake(){ try{ wakeLock && wakeLock.release(); wakeLock=null; }catch(e){} }

function enterFull(){
  const stage = $('#stage');
  stage.classList.add('on');
  const inner = $('#stageInner');
  // 약간 지연 후 측정 (display flex 적용 대기)
  requestAnimationFrame(()=>{
    renderInto(inner, true);
  });
  // 브라우저 fullscreen 도 시도
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  requestWake();
}
function exitFull(){
  $('#stage').classList.remove('on');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  releaseWake();
}

$('#goFull').addEventListener('click', enterFull);
$('#stage').addEventListener('click', exitFull);
$('#stage').addEventListener('touchstart', e=>{ e.preventDefault(); exitFull(); }, {passive:false});

// 회전/리사이즈 시 다시 렌더
let resizeT = null;
function onResize(){
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>{
    updatePreview();
    if ($('#stage').classList.contains('on')) renderInto($('#stageInner'), true);
  }, 80);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// 초기
window.addEventListener('load', ()=>{
  // 폰트 로드 후 다시 렌더 (정확한 크기 계산을 위해)
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=> updatePreview());
  }
  updatePreview();
});
updatePreview();
</script>
</body>
</html>
