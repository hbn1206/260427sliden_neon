<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>응원 문구 LED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=Gugi&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#0b0d12;color:#fff;font-family:'Noto Sans KR',sans-serif;}
  body{overscroll-behavior:none;}
  .app{padding:14px 14px 40px;max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin:6px 0 12px;text-align:center;}
  .card{background:#161922;border:1px solid #242938;border-radius:14px;padding:12px;margin-bottom:12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid #2c3145;background:#1d2230;color:#fff;font-size:14px;cursor:pointer;}
  .btn.active{background:#3a6df0;border-color:#3a6df0;}
  .btn.primary{background:#ef4444;border-color:#ef4444;font-weight:700;font-size:16px;padding:14px;}
  .label{font-size:13px;color:#9aa3b2;margin:6px 2px;}
  .examples{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ex{padding:10px;border-radius:10px;background:#1d2230;border:1px solid #2c3145;color:#fff;font-size:13px;text-align:left;cursor:pointer;line-height:1.4;}
  textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid #2c3145;background:#0f131c;color:#fff;padding:10px;font-size:14px;font-family:inherit;resize:vertical;}
  select,input[type=color],input[type=range]{background:#0f131c;color:#fff;border:1px solid #2c3145;border-radius:8px;padding:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  /* 미리보기 */
  .preview{aspect-ratio:16/9;width:100%;border-radius:12px;overflow:hidden;position:relative;background:#000;}
  /* 무대(미리보기/전체화면 공용) */
  .stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stage .text{display:inline-block;font-weight:900;line-height:1.05;text-align:center;white-space:pre-wrap;word-break:keep-all;padding:0 8px;}
  /* 흐르기 */
  .marquee{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;}
  .marquee .track{display:inline-block;white-space:nowrap;font-weight:900;line-height:1;will-change:transform;}
  /* 깜빡임 */
  @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
  .blink{animation:blink 0.8s steps(1) infinite;}
  /* 무지개 */
  @keyframes rainbow {
    0%{color:#ff3b30}16%{color:#ff9500}33%{color:#ffcc00}
    50%{color:#34c759}66%{color:#00c7be}83%{color:#5856d6}100%{color:#af52de}
  }
  .rainbow{animation:rainbow 3s linear infinite;}
  /* 전체화면 */
  .fullscreen{position:fixed;inset:0;z-index:9999;background:#000;}
  .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:12px;z-index:10000;pointer-events:none;}
  .hide{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app">
  <h1>📣 응원 문구 LED</h1>

  <div class="card">
    <div class="label">분임 선택</div>
    <div class="row">
      <button class="btn active" data-team="ai">에듀테크AI(고)</button>
      <button class="btn" data-team="math">수학</button>
    </div>
  </div>

  <div class="card">
    <div class="label">예시 문구 (눌러서 바로 적용)</div>
    <div class="examples" id="examples"></div>
  </div>

  <div class="card">
    <div class="label">직접 입력</div>
    <textarea id="msg" placeholder="응원 문구를 입력하세요">에듀테크 AI 최고!!</textarea>
  </div>

  <div class="card">
    <div class="label">효과</div>
    <div class="row">
      <button class="btn fx active" data-fx="marquee">흐르기</button>
      <button class="btn fx" data-fx="blink">깜빡임</button>
      <button class="btn fx" data-fx="rainbow">무지개</button>
      <button class="btn fx" data-fx="static">고정</button>
    </div>
    <div class="grid3" style="margin-top:10px;">
      <div class="field">
        <span class="label">글자색</span>
        <input type="color" id="fg" value="#ffffff">
      </div>
      <div class="field">
        <span class="label">배경색</span>
        <input type="color" id="bg" value="#000000">
      </div>
      <div class="field">
        <span class="label">속도(흐르기)</span>
        <input type="range" id="speed" min="60" max="500" value="220">
      </div>
    </div>
    <div class="field" style="margin-top:10px;">
      <span class="label">글꼴</span>
      <select id="font">
        <option value="'Black Han Sans', sans-serif">Black Han Sans (강한 임팩트)</option>
        <option value="'Noto Sans KR', sans-serif" selected>Noto Sans KR (깔끔)</option>
        <option value="'Do Hyeon', sans-serif">Do Hyeon (둥근 고딕)</option>
        <option value="'Jua', sans-serif">Jua (귀여움)</option>
        <option value="'Gugi', cursive">Gugi (강렬 캘리)</option>
        <option value="'Gaegu', cursive">Gaegu (손글씨)</option>
        <option value="'Nanum Pen Script', cursive">Nanum Pen (펜글씨)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="label">미리보기</div>
    <div class="preview" id="preview"></div>
  </div>

  <button class="btn primary" id="goFull">🚀 전체화면으로 보기</button>
</div>

<div class="hint hide" id="hint">화면을 한 번 탭하면 돌아갑니다</div>

<script>
const EXAMPLES = {
  ai: [
    "에듀테크 AI 최고!!",
    "AI로 미래교육 선도! 에듀테크AI(고) 파이팅!",
    "코딩으로 빛나는 우리, 에듀테크AI(고)!",
    "도전 또 도전! 에듀테크AI(고) 열정 폭발 🔥"
  ],
  math: [
    "수학 분임 파이팅!!",
    "공식보다 뜨거운 열정, 수학 분임!",
    "정답을 향한 도전! 수학 분임 최고 💯",
    "논리로 무장한 우리, 수학 분임 GO!"
  ]
};

const $ = s => document.querySelector(s);
const app = $('#app');
const preview = $('#preview');
const msgEl = $('#msg');
const exBox = $('#examples');
const hint = $('#hint');

let team = 'ai';
let fx = 'marquee';

// 분임 버튼
document.querySelectorAll('[data-team]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-team]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    team = b.dataset.team;
    renderExamples();
  });
});

// 효과 버튼
document.querySelectorAll('.fx').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fx').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    fx = b.dataset.fx;
    render();
  });
});

function renderExamples(){
  exBox.innerHTML = '';
  EXAMPLES[team].forEach(t=>{
    const b = document.createElement('button');
    b.className='ex';
    b.textContent=t;
    b.addEventListener('click',()=>{ msgEl.value = t; render(); });
    exBox.appendChild(b);
  });
}
renderExamples();

// 옵션 변경 시 즉시 반영
['#msg','#fg','#bg','#speed','#font'].forEach(sel=>{
  document.querySelector(sel).addEventListener('input', render);
});

// === 핵심: stage 렌더링 ===
function buildStage(container, fullscreen){
  const text = (msgEl.value || ' ').trim() || ' ';
  const fg = $('#fg').value;
  const bg = $('#bg').value;
  const font = $('#font').value;
  const speed = parseInt($('#speed').value, 10); // px/sec

  container.style.background = bg;
  container.innerHTML = '';

  if(fx === 'marquee'){
    // 흐르기: 오른쪽 밖에서 왼쪽 밖으로 이동, 사라진 후 2초 정지, 반복
    const wrap = document.createElement('div');
    wrap.className = 'marquee';
    const track = document.createElement('span');
    track.className = 'track';
    track.textContent = text;
    track.style.color = fg;
    track.style.fontFamily = font;
    wrap.appendChild(track);
    container.appendChild(wrap);

    // 글자 높이: 미리보기/전체화면 모두 컨테이너 높이의 70%
    requestAnimationFrame(()=>{
      const ch = container.clientHeight;
      const cw = container.clientWidth;
      const targetH = ch * 0.70;
      // 폰트 사이즈를 line-height 1 기준으로 targetH로 (대략 0.78 보정)
      track.style.fontSize = Math.max(10, Math.floor(targetH / 0.95)) + 'px';

      // 한 사이클 거리 = 컨테이너폭 + 텍스트폭 (오른쪽 밖 → 왼쪽 밖)
      const tw = track.getBoundingClientRect().width;
      const distance = cw + tw;
      const moveSec = distance / speed;
      const pauseSec = 2; // 사라진 후 2초 정지
      const totalSec = moveSec + pauseSec;
      const endPct = (moveSec / totalSec) * 100;

      // 동적 keyframes 주입
      const animName = 'mq_' + Math.random().toString(36).slice(2,8);
      const styleEl = document.createElement('style');
      styleEl.textContent = `
        @keyframes ${animName}{
          0%      { transform: translateX(${cw}px); }
          ${endPct.toFixed(3)}% { transform: translateX(${-tw}px); }
          100%    { transform: translateX(${-tw}px); }
        }
      `;
      container.appendChild(styleEl);
      // 즉시 시작 - 초기 위치를 강제로 오른쪽 밖에 두고 다음 프레임에서 애니메이션 시작
      track.style.transform = `translateX(${cw}px)`;
      // 강제 reflow → 애니메이션이 0%부터 즉시 시작되도록
      void track.offsetWidth;
      track.style.animation = `${animName} ${totalSec.toFixed(3)}s linear infinite`;
      track.style.animationDelay = '0s';
    });

  } else {
    // 깜빡임 / 무지개 / 고정: 화면(또는 미리보기)에 글씨 다 보이게
    const wrap = document.createElement('div');
    wrap.className = 'stage';
    const span = document.createElement('span');
    span.className = 'text';
    if(fx === 'blink') span.classList.add('blink');
    if(fx === 'rainbow') span.classList.add('rainbow');
    span.textContent = text;
    span.style.color = (fx === 'rainbow') ? '' : fg;
    span.style.fontFamily = font;
    wrap.appendChild(span);
    container.appendChild(wrap);

    // 폰트 크기 자동 산정
    requestAnimationFrame(()=>{
      const cw = container.clientWidth - 16;
      const ch = container.clientHeight;
      // 전체화면이면 우선 높이의 70%로 시도, 안 들어가면 줄임
      let lo = 8, hi = fullscreen ? Math.floor(ch * 1.2) : Math.floor(ch);
      let best = lo;
      while(lo <= hi){
        const mid = (lo + hi) >> 1;
        span.style.fontSize = mid + 'px';
        if(span.scrollWidth <= cw && span.scrollHeight <= ch){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      if(fullscreen){
        // 전체화면: 가능하면 높이 70%에 맞추되, 화면을 넘지 않도록
        const target70 = Math.floor(ch * 0.70);
        span.style.fontSize = Math.min(best, target70 > best ? best : target70) + 'px';
        // 다시 검증: 70% 적용시 가로 넘치면 best로 회귀
        if(span.scrollWidth > cw || span.scrollHeight > ch){
          span.style.fontSize = best + 'px';
        } else if (target70 <= best) {
          span.style.fontSize = target70 + 'px';
        } else {
          span.style.fontSize = best + 'px';
        }
      } else {
        span.style.fontSize = best + 'px';
      }
    });
  }
}

function render(){
  buildStage(preview, false);
}

// 폰트 로딩 후 다시 그리기 (크기 계산 정확하도록)
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>render());
}

// 첫 렌더
render();
window.addEventListener('resize', ()=>{
  render();
  if(fsEl){ buildStage(fsEl, true); }
});
window.addEventListener('orientationchange', ()=>{
  setTimeout(()=>{ render(); if(fsEl) buildStage(fsEl, true); }, 200);
});

// === 전체화면 ===
let fsEl = null;
let wakeLock = null;

async function enterFullscreen(){
  fsEl = document.createElement('div');
  fsEl.className = 'fullscreen';
  document.body.appendChild(fsEl);
  app.classList.add('hide');
  hint.classList.remove('hide');
  setTimeout(()=>hint.classList.add('hide'), 2500);

  buildStage(fsEl, true);

  // Fullscreen API 시도 (실패해도 CSS 전체화면은 동작)
  try{
    if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    } else if(document.documentElement.webkitRequestFullscreen){
      document.documentElement.webkitRequestFullscreen();
    }
  }catch(e){}

  // Wake Lock
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}

  // 한 번 탭하면 종료 — 진입 직후 즉시 닫히지 않게 약간 지연
  setTimeout(()=>{
    fsEl.addEventListener('click', exitFullscreen, { once:true });
    fsEl.addEventListener('touchstart', exitFullscreen, { once:true, passive:true });
  }, 250);
}

async function exitFullscreen(){
  try{
    if(document.fullscreenElement && document.exitFullscreen){
      await document.exitFullscreen();
    } else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    }
  }catch(e){}
  try{ if(wakeLock){ await wakeLock.release(); wakeLock = null; } }catch(e){}
  if(fsEl){ fsEl.remove(); fsEl = null; }
  app.classList.remove('hide');
  hint.classList.add('hide');
}

$('#goFull').addEventListener('click', enterFullscreen);

// 시스템 ESC/뒤로가기로 풀스크린 빠져나갔을 때 복귀
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && fsEl){ exitFullscreen(); }
});
</script>
</body>
</html>
