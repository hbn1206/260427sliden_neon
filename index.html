<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b14" />
<title>응원 문구 LED</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b14; color: #fff;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- 설정 화면 ---------- */
  #setup {
    flex: 1; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  h1 { font-size: 20px; margin: 4px 0 12px; text-align: center; letter-spacing: -0.5px; }
  .card { background: #15151f; border: 1px solid #23233a; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .label { font-size: 13px; color: #aab; margin-bottom: 8px; font-weight: 600; }

  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #2a2a45;
    background: #1c1c2c; color: #ddd; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .seg button.active { background: #4f7cff; color: white; border-color: #4f7cff; }

  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .examples button {
    padding: 12px 10px; border-radius: 10px; border: 1px solid #2a2a45;
    background: #1c1c2c; color: #fff; font-size: 14px; line-height: 1.35; cursor: pointer;
    text-align: center; min-height: 56px;
  }
  .examples button:active { background: #2a2a45; }

  textarea {
    width: 100%; min-height: 80px; padding: 12px; border-radius: 10px;
    border: 1px solid #2a2a45; background: #0f0f18; color: #fff; font-size: 16px;
    resize: vertical; font-family: inherit;
  }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .colorBox { display: flex; align-items: center; gap: 8px; background: #1c1c2c;
    padding: 8px 10px; border-radius: 10px; border: 1px solid #2a2a45; }
  .colorBox span { font-size: 13px; color: #ccd; }
  input[type="color"] { width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; padding: 0; }

  select, input[type="range"] {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #2a2a45;
    background: #1c1c2c; color: #fff; font-size: 14px;
  }
  input[type="range"] { padding: 0; }

  /* ---------- 미리보기 ---------- */
  #previewCard { padding: 8px; }
  #preview {
    width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    background: #000; position: relative;
  }

  /* ---------- 큰 버튼 ---------- */
  .bigBtn {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #4f7cff, #7c3aed); color: white;
    font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  .bigBtn:active { transform: scale(0.99); }

  /* ---------- 무대(미리보기 + 전체화면 공용) ---------- */
  .stage {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .stage .text-static {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2%;
    white-space: pre-wrap; word-break: keep-all; line-height: 1.15;
    font-weight: 900; letter-spacing: -0.5px;
  }
  /* 흐르기: 한 줄, 가로 마퀴 */
  .stage .marquee {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%);
    white-space: nowrap; font-weight: 900; letter-spacing: -0.5px;
    will-change: transform;
  }
  .marquee .track {
    display: inline-block; will-change: transform;
    animation: marquee linear infinite;
  }
  .marquee .seg { display: inline-block; padding-right: 2em; } /* 문구 사이 간격 */
  @keyframes marquee {
    from { transform: translateX(var(--start, 100%)); }
    to   { transform: translateX(var(--end, -50%)); }
  }

  /* 깜빡임 */
  .blink { animation: blink 0.9s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* 무지개 */
  .rainbow {
    background: linear-gradient(90deg,#ff0040,#ff8a00,#ffd500,#00d26a,#00b4ff,#7a5cff,#ff3df0,#ff0040);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent !important;
    animation: rainbow 4s linear infinite;
  }
  @keyframes rainbow { to { background-position: -200% 0; } }

  /* ---------- 전체화면 ---------- */
  #fullstage {
    position: fixed; inset: 0; z-index: 9999; background: #000;
    display: none;
  }
  #fullstage.on { display: block; }
  body.full #setup { display: none; }

  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 12px; pointer-events: none;
    background: rgba(0,0,0,0.25); padding: 4px 10px; border-radius: 999px;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>📣 응원 문구 LED</h1>

  <!-- 분임 선택 -->
  <div class="card">
    <div class="label">분임 선택</div>
    <div class="seg" id="groupSeg">
      <button data-group="edu" class="active">에듀테크AI(고)</button>
      <button data-group="math">수학</button>
    </div>
  </div>

  <!-- 예시 문구 -->
  <div class="card">
    <div class="label">예시 문구 (탭하여 선택)</div>
    <div class="examples" id="examples"></div>
  </div>

  <!-- 직접 입력 -->
  <div class="card">
    <div class="label">직접 입력</div>
    <textarea id="text" placeholder="응원 문구를 입력하세요">에듀테크AI(고) 분임 파이팅!</textarea>
  </div>

  <!-- 옵션 -->
  <div class="card">
    <div class="label">효과</div>
    <select id="effect">
      <option value="marquee">흐르기 (좌우로 흘러감)</option>
      <option value="blink">깜빡임</option>
      <option value="rainbow">무지개</option>
      <option value="static">고정</option>
    </select>
  </div>

  <div class="card">
    <div class="label">속도 (흐르기 전용)</div>
    <input type="range" id="speed" min="1" max="10" value="5" />
  </div>

  <div class="card">
    <div class="label">색상</div>
    <div class="row">
      <div class="colorBox"><span>글자</span><input type="color" id="fg" value="#ffeb3b"></div>
      <div class="colorBox"><span>배경</span><input type="color" id="bg" value="#000000"></div>
    </div>
  </div>

  <!-- 미리보기 -->
  <div class="card" id="previewCard">
    <div class="label" style="padding: 4px 4px 8px;">미리보기</div>
    <div id="preview">
      <div class="stage" id="previewStage"></div>
    </div>
  </div>

  <!-- 전체화면 버튼 -->
  <button class="bigBtn" id="goFull">🚀 전체화면으로 보기</button>
  <p style="text-align:center; color:#889; font-size:12px; margin-top:8px;">
    전체화면에서 화면을 한 번 탭하면 돌아옵니다.<br/>
    가로로 회전하면 더 크게 보여요 📱↔️
  </p>
</div>

<!-- 전체화면 무대 -->
<div id="fullstage">
  <div class="stage" id="fullStage"></div>
  <div class="hint">화면을 탭하면 돌아갑니다</div>
</div>

<script>
  // ---------- 데이터 ----------
  const EXAMPLES = {
    edu: [
      "에듀테크AI(고)\n미래 교육의 주인공!",
      "AI와 함께\n수업이 살아난다! 🚀",
      "에듀테크 고수들\n오늘도 폭발적 열정! 🔥",
      "코드도 수업도\n우리가 1등! 💯"
    ],
    math: [
      "수학 분임\n공식보다 뜨거운 열정! 🔥",
      "문제는 풀라고 있는 것!\n수학 분임 파이팅! ✨",
      "수학으로 세상을\n증명한다! 📐",
      "정답보다 빛나는\n우리들의 도전! 💪"
    ]
  };

  // ---------- 요소 ----------
  const $ = (s) => document.querySelector(s);
  const groupSeg   = $('#groupSeg');
  const examplesEl = $('#examples');
  const textEl     = $('#text');
  const effectEl   = $('#effect');
  const speedEl    = $('#speed');
  const fgEl       = $('#fg');
  const bgEl       = $('#bg');
  const previewStage = $('#previewStage');
  const fullStage    = $('#fullStage');
  const fullstageBox = $('#fullstage');
  const goFullBtn    = $('#goFull');

  let currentGroup = 'edu';

  // ---------- 예시 렌더 ----------
  function renderExamples(){
    examplesEl.innerHTML = '';
    EXAMPLES[currentGroup].forEach(t => {
      const b = document.createElement('button');
      b.textContent = t;
      b.addEventListener('click', () => { textEl.value = t; render(); });
      examplesEl.appendChild(b);
    });
  }
  groupSeg.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...groupSeg.children].forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    currentGroup = btn.dataset.group;
    renderExamples();
  });
  renderExamples();

  // ---------- 핵심: stage 그리기 ----------
  function buildStage(stageEl){
    const text   = textEl.value || ' ';
    const effect = effectEl.value;
    const speed  = parseInt(speedEl.value, 10); // 1~10
    const fg     = fgEl.value;
    const bg     = bgEl.value;

    stageEl.style.background = bg;
    stageEl.style.color      = fg;
    stageEl.innerHTML        = '';

    if (effect === 'marquee') {
      // 흐르기: 화면 중앙에서 시작 -> 끝까지 흘러간 후 끊김 없이 반복
      const wrap = document.createElement('div');
      wrap.className = 'marquee';

      const track = document.createElement('div');
      track.className = 'track';

      // 두 세트(seg) 이상 깔아서 -50% 이동 시 이음새가 없도록
      // (한 세트는 텍스트 + 오른쪽 여백)
      const html = `<span class="seg">${escapeHtml(text)}</span>`;
      track.innerHTML = html + html; // 최소 2벌

      wrap.appendChild(track);
      stageEl.appendChild(wrap);

      // 폰트: 화면 높이의 70%
      const ch = stageEl.clientHeight || 1;
      const fontPx = Math.max(20, Math.floor(ch * 0.7));
      wrap.style.fontSize = fontPx + 'px';

      // 시작 위치: 화면의 가운데에서 시작
      // CSS keyframe은 from translateX(var(--start)) -> to translateX(var(--end))
      // 시작 = 무대 가운데 (=무대 폭의 50% 만큼 오른쪽으로 밀어둠)
      // 끝 = -50% (한 세트만큼 이동 -> 두 번째 세트가 정확히 첫 번째 자리로 와서 무한 반복)
      wrap.style.setProperty('--start', '50%');   // 화면 중앙에서 시작 (track의 왼쪽 끝이 무대 중앙)
      wrap.style.setProperty('--end',   '-50%');  // 한 세트 이동 -> 끊김 없이 반복

      // 속도: 한 세트가 흐르는 시간(초). 폰트가 클수록 한 세트 폭도 큼 -> 일정한 픽셀 속도가 되도록
      // 단순 매핑: 느림(1) ~ 빠름(10)
      const durFromCenter = (11 - speed) * 1.2; // 첫 사이클: 50% -> -50% 이동
      // 동일한 키프레임이 무한반복되므로 두 번째 사이클부터 완벽 루프
      wrap.style.animation = 'none';
      // reflow
      void wrap.offsetWidth;
      wrap.querySelector('.track').style.animation =
        `marquee ${durFromCenter}s linear infinite`;

    } else {
      // 고정/깜빡임/무지개: 한 화면에 전부 보이도록 크기 자동 맞춤
      const div = document.createElement('div');
      div.className = 'text-static';
      div.textContent = text;

      if (effect === 'blink')   div.classList.add('blink');
      if (effect === 'rainbow') div.classList.add('rainbow');

      stageEl.appendChild(div);

      // 다음 프레임에 폰트 사이즈 피팅
      requestAnimationFrame(() => fitText(stageEl, div));
    }
  }

  // 컨테이너 안에 텍스트가 가득 차도록 폰트 크기를 이진 탐색으로 결정
  function fitText(container, el){
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    if (cw < 10 || ch < 10) return;

    let lo = 8, hi = Math.floor(ch * 1.2), best = lo;
    el.style.whiteSpace = 'pre-wrap';
    el.style.wordBreak  = 'keep-all';

    while (lo <= hi){
      const mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      const fits = (el.scrollWidth <= cw + 1) && (el.scrollHeight <= ch + 1);
      if (fits) { best = mid; lo = mid + 1; }
      else      { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- 렌더 ----------
  function render(){
    buildStage(previewStage);
    if (document.body.classList.contains('full')) {
      buildStage(fullStage);
    }
  }
  ['input','change'].forEach(ev=>{
    textEl.addEventListener(ev, render);
    effectEl.addEventListener(ev, render);
    speedEl.addEventListener(ev, render);
    fgEl.addEventListener(ev, render);
    bgEl.addEventListener(ev, render);
  });

  // ---------- 전체화면 ----------
  async function enterFull(){
    document.body.classList.add('full');
    fullstageBox.classList.add('on');
    try { await document.documentElement.requestFullscreen?.(); } catch(e){}
    try { await screen.orientation?.lock?.('landscape'); } catch(e){}
    requestWakeLock();
    // 다음 프레임에 그리기 (레이아웃 확정 후)
    requestAnimationFrame(() => buildStage(fullStage));
  }
  function exitFull(){
    document.body.classList.remove('full');
    fullstageBox.classList.remove('on');
    try { document.exitFullscreen?.(); } catch(e){}
    try { screen.orientation?.unlock?.(); } catch(e){}
    releaseWakeLock();
    // 미리보기 다시 그리기 (회전 등 변경 반영)
    requestAnimationFrame(() => buildStage(previewStage));
  }
  goFullBtn.addEventListener('click', enterFull);
  fullstageBox.addEventListener('click', exitFull);
  fullstageBox.addEventListener('touchstart', (e)=>{ e.preventDefault(); exitFull(); }, {passive:false});

  // ---------- Wake Lock ----------
  let wakeLock = null;
  async function requestWakeLock(){
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
  }
  function releaseWakeLock(){
    try { wakeLock?.release(); } catch(e){}
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.body.classList.contains('full')) {
      requestWakeLock();
    }
  });

  // ---------- 리사이즈/회전 ----------
  let rT;
  function onResize(){
    clearTimeout(rT);
    rT = setTimeout(() => {
      if (document.body.classList.contains('full')) buildStage(fullStage);
      else buildStage(previewStage);
    }, 80);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // 첫 렌더
  window.addEventListener('load', () => requestAnimationFrame(render));
</script>
</body>
</html>
