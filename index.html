<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>모바일 응원 문구 LED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=Gugi&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0b0b0c;color:#f3f3f3;font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ===== 설정 화면 ===== */
  #settings{padding:14px 14px 28px;max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:6px 0 14px;letter-spacing:.5px;text-align:center}
  h1 span{color:#ffd84d}

  .card{background:#17181b;border:1px solid #2a2c31;border-radius:14px;padding:12px 12px 14px;margin-bottom:12px}
  .label{font-size:13px;color:#b9bcc3;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row.col2>*{flex:1 1 calc(50% - 4px)}

  button,select,input,textarea{font-family:inherit;color:#f3f3f3}
  .btn{appearance:none;border:1px solid #2f3137;background:#1f2126;color:#eaeaea;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover{background:#262931}
  .btn.active{background:#ffd84d;color:#1a1a1a;border-color:#ffd84d;font-weight:700}
  .btn.primary{background:linear-gradient(135deg,#ff5e62,#ff9966);border:0;font-weight:800;font-size:16px;padding:14px;width:100%;color:#fff}
  .btn.primary:active{transform:scale(.99)}

  .examples{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .examples .btn{font-size:13px;padding:12px 8px;line-height:1.35;text-align:center;min-height:60px;white-space:pre-wrap}

  textarea{width:100%;min-height:72px;background:#0f1013;border:1px solid #2a2c31;border-radius:10px;padding:10px;font-size:15px;resize:vertical}
  textarea:focus{outline:none;border-color:#ffd84d}

  select{width:100%;background:#0f1013;border:1px solid #2a2c31;border-radius:10px;padding:10px;font-size:14px}

  input[type=color]{width:48px;height:36px;border:1px solid #2a2c31;border-radius:8px;background:#0f1013;padding:2px;cursor:pointer}
  .colorRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .colorRow label{font-size:13px;color:#b9bcc3}

  /* ===== 미리보기 ===== */
  #previewBox{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative;border:1px solid #2a2c31}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stageText{
    text-align:center;
    line-height:1.05;
    white-space:pre-wrap;
    word-break:keep-all;
    font-weight:900;
    padding:0 6px;
    max-width:100%;
    max-height:100%;
  }

  /* ===== 전체화면 ===== */
  #fullscreen{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9999;overflow:hidden;cursor:pointer}
  #fullscreen.show{display:flex}
  #fullscreenStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:12px;pointer-events:none;animation:hintFade 3s ease forwards}
  @keyframes hintFade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

  /* ===== 효과 ===== */
  /* 무지개 깜빡임: 색이 바뀌면서 깜빡임 */
  @keyframes rainbowBlink{
    0%,18%   { color:#ff3b30; opacity:1 }
    19%,24%  { opacity:0 }
    25%,42%  { color:#ff9500; opacity:1 }
    43%,49%  { opacity:0 }
    50%,60%  { color:#ffd60a; opacity:1 }
    61%,66%  { opacity:0 }
    67%,76%  { color:#34c759; opacity:1 }
    77%,82%  { opacity:0 }
    83%,89%  { color:#0a84ff; opacity:1 }
    90%,93%  { opacity:0 }
    94%,98%  { color:#bf5af2; opacity:1 }
    99%,100% { opacity:0 }
  }
  .fx-rainbow-blink{ animation: rainbowBlink 2.4s steps(1,end) infinite; }

  /* 깜빡임: 사용자 글자색으로 켜졌다 꺼졌다 */
  @keyframes blinkOnly{
    0%,49%   { opacity:1 }
    50%,100% { opacity:0 }
  }
  .fx-blink{ animation: blinkOnly 0.8s steps(1,end) infinite; }

  /* 고정 */
  .fx-static{ animation:none }

  .small{font-size:12px;color:#8b8f97}
  .footer{margin-top:8px;text-align:center;color:#6c707a;font-size:11px}
</style>
</head>
<body>

<div id="settings">
  <h1>📣 모바일 응원 <span>LED</span></h1>

  <!-- 분임 선택 -->
  <div class="card">
    <div class="label">1. 분임 선택</div>
    <div class="row col2">
      <button class="btn group active" data-group="edutech">에듀테크AI(고) 분임</button>
      <button class="btn group" data-group="math">수학 분임</button>
    </div>
  </div>

  <!-- 예시 문구 -->
  <div class="card">
    <div class="label">2. 예시 문구 (탭하면 자동 입력)</div>
    <div class="examples" id="examples"></div>
  </div>

  <!-- 직접 입력 -->
  <div class="card">
    <div class="label">3. 직접 입력
      <button class="btn" id="clearBtn" style="padding:4px 10px;font-size:12px">지우기</button>
    </div>
    <textarea id="inputText" placeholder="응원 문구를 직접 입력하세요&#10;줄바꿈도 가능합니다"></textarea>
  </div>

  <!-- 효과 -->
  <div class="card">
    <div class="label">4. 효과</div>
    <div class="row">
      <button class="btn fx active" data-fx="rainbow-blink">🌈 무지개 깜빡임</button>
      <button class="btn fx" data-fx="blink">✨ 깜빡임</button>
      <button class="btn fx" data-fx="static">⏺ 고정</button>
    </div>
  </div>

  <!-- 색상 / 글꼴 -->
  <div class="card">
    <div class="label">5. 색상 & 글꼴</div>
    <div class="colorRow" style="margin-bottom:10px">
      <label>글자색 <input type="color" id="colorText" value="#ffd84d"></label>
      <label>배경색 <input type="color" id="colorBg" value="#000000"></label>
      <span class="small">(무지개 깜빡임은 글자색 무시)</span>
    </div>
    <select id="fontSelect">
      <option value="'Black Han Sans',sans-serif">Black Han Sans (굵직 추천👍)</option>
      <option value="'Noto Sans KR',sans-serif" selected>Noto Sans KR 900</option>
      <option value="'Do Hyeon',sans-serif">Do Hyeon (둥근 고딕)</option>
      <option value="'Jua',sans-serif">Jua (귀여움)</option>
      <option value="'Gugi',cursive">Gugi (캘리)</option>
      <option value="'Gaegu',cursive">Gaegu (손글씨)</option>
      <option value="'Nanum Pen Script',cursive">Nanum Pen Script (펜글씨)</option>
    </select>
  </div>

  <!-- 미리보기 -->
  <div class="card">
    <div class="label">6. 미리보기</div>
    <div id="previewBox">
      <div class="stage" id="previewStage">
        <div class="stageText" id="previewText"></div>
      </div>
    </div>
  </div>

  <!-- 실행 -->
  <button class="btn primary" id="goFs">🚀 전체화면으로 보기</button>
  <div class="footer">전체화면에서 화면을 한 번 탭하면 돌아옵니다</div>
</div>

<!-- 전체화면 -->
<div id="fullscreen">
  <div id="fullscreenStage">
    <div class="stageText" id="fullscreenText"></div>
  </div>
  <div class="hint">화면을 탭하면 돌아갑니다</div>
</div>

<script>
/* ============ 데이터 ============ */
const PHRASES = {
  edutech: [
    "에듀테크 AI\n최고!! 🚀",
    "AI로 미래를\n바꾸자! 💡",
    "코딩하는\n에듀테크 파이팅! 🔥",
    "우리가 만드는\n스마트 교실! ⭐"
  ],
  math: [
    "수학 분임\n최강! ➕✖️",
    "공식보다 빠른\n우리의 열정! 🔥",
    "풀어내자\n무한대의 도전! ∞",
    "수학으로\n세상을 증명! 📐"
  ]
};

/* ============ 상태 ============ */
const state = {
  group: 'edutech',
  fx: 'rainbow-blink',
  text: '에듀테크 AI\n최고!! 🚀',
  color: '#ffd84d',
  bg: '#000000',
  font: "'Noto Sans KR',sans-serif"
};

/* ============ DOM ============ */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const examplesEl = $('#examples');
const inputText  = $('#inputText');
const colorText  = $('#colorText');
const colorBg    = $('#colorBg');
const fontSelect = $('#fontSelect');
const previewBox = $('#previewBox');
const previewStage = $('#previewStage');
const previewText  = $('#previewText');
const fullscreen   = $('#fullscreen');
const fullscreenStage = $('#fullscreenStage');
const fullscreenText  = $('#fullscreenText');

/* ============ 예시 렌더 ============ */
function renderExamples(){
  examplesEl.innerHTML = '';
  PHRASES[state.group].forEach(p => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = p;
    b.addEventListener('click', () => {
      inputText.value = p;
      state.text = p;
      updatePreview();
    });
    examplesEl.appendChild(b);
  });
}

/* ============ 그룹 / 효과 토글 ============ */
$$('.group').forEach(b => b.addEventListener('click', () => {
  $$('.group').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.group = b.dataset.group;
  renderExamples();
}));
$$('.fx').forEach(b => b.addEventListener('click', () => {
  $$('.fx').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.fx = b.dataset.fx;
  updatePreview();
}));

/* ============ 인풋 ============ */
inputText.addEventListener('input', () => { state.text = inputText.value; updatePreview(); });
colorText.addEventListener('input',  () => { state.color = colorText.value; updatePreview(); });
colorBg.addEventListener('input',    () => { state.bg = colorBg.value; updatePreview(); });
fontSelect.addEventListener('change',() => { state.font = fontSelect.value; updatePreview(); });
$('#clearBtn').addEventListener('click', () => { inputText.value=''; state.text=''; updatePreview(); inputText.focus(); });

/* ============ 폰트 크기 자동 산정 (이진 탐색) ============ */
function fitTextSize(containerEl, textEl, text, fontFamily, opts={}){
  const minPx = opts.min || 12;
  const maxPx = opts.max || 2000;

  // 빈 문자열 가드
  if(!text || !text.trim()){
    textEl.textContent = '';
    return;
  }

  textEl.textContent = text;
  textEl.style.fontFamily = fontFamily;
  textEl.style.fontSize   = '100px';

  const cw = containerEl.clientWidth;
  const ch = containerEl.clientHeight;

  let lo = minPx, hi = maxPx, best = minPx;
  // 안전장치: 50회 반복
  for(let i=0; i<50 && lo<=hi; i++){
    const mid = (lo + hi) >> 1;
    textEl.style.fontSize = mid + 'px';
    if(textEl.scrollWidth <= cw && textEl.scrollHeight <= ch){
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  textEl.style.fontSize = best + 'px';
}

/* ============ 효과 클래스 적용 ============ */
function applyFx(textEl, fx, color){
  textEl.classList.remove('fx-rainbow-blink','fx-blink','fx-static');
  if(fx === 'rainbow-blink'){
    textEl.classList.add('fx-rainbow-blink');
    // 무지개 깜빡임은 색을 자체 keyframes에서 변경
  } else if(fx === 'blink'){
    textEl.classList.add('fx-blink');
    textEl.style.color = color;
  } else {
    textEl.classList.add('fx-static');
    textEl.style.color = color;
  }
}

/* ============ 미리보기 업데이트 ============ */
function updatePreview(){
  previewBox.style.background = state.bg;
  applyFx(previewText, state.fx, state.color);
  // 미리보기는 박스 안에 전체 텍스트가 다 보이도록
  fitTextSize(previewBox, previewText, state.text, state.font, {max: 400});
}

/* ============ 전체화면 ============ */
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}

function enterFullscreen(){
  fullscreen.style.background = state.bg;
  applyFx(fullscreenText, state.fx, state.color);
  fullscreen.classList.add('show');

  // 브라우저 fullscreen API (선택적)
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(req){ try{ req.call(el); }catch(e){} }

  requestWakeLock();

  // 화면 가득 채우기 (최대 크기로)
  // 컨테이너 크기 측정 후 fitTextSize 호출 (max 매우 크게)
  requestAnimationFrame(() => {
    fitTextSize(fullscreenStage, fullscreenText, state.text, state.font, {max: 5000});
  });
}

function exitFullscreen(){
  fullscreen.classList.remove('show');
  if(document.fullscreenElement || document.webkitFullscreenElement){
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if(ex){ try{ ex.call(document); }catch(e){} }
  }
  releaseWakeLock();
}

$('#goFs').addEventListener('click', enterFullscreen);

// 전체화면에서 탭 시 복귀
let fsLock = false;
function onFsTap(e){
  e.preventDefault();
  if(fsLock) return;
  fsLock = true;
  setTimeout(()=>{ fsLock = false; }, 300);
  exitFullscreen();
}
fullscreen.addEventListener('click', onFsTap);
fullscreen.addEventListener('touchstart', onFsTap, {passive:false});

// 화면 회전/리사이즈 시 재계산
window.addEventListener('resize', () => {
  if(fullscreen.classList.contains('show')){
    fitTextSize(fullscreenStage, fullscreenText, state.text, state.font, {max: 5000});
  }
  updatePreview();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if(fullscreen.classList.contains('show')){
      fitTextSize(fullscreenStage, fullscreenText, state.text, state.font, {max: 5000});
    }
    updatePreview();
  }, 250);
});

// 폰트 로딩 완료 후 다시 그리기
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    updatePreview();
    if(fullscreen.classList.contains('show')){
      fitTextSize(fullscreenStage, fullscreenText, state.text, state.font, {max: 5000});
    }
  });
}

// ESC로 닫기 (PC 테스트용)
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && fullscreen.classList.contains('show')) exitFullscreen();
});

/* ============ 초기화 ============ */
function init(){
  renderExamples();
  inputText.value = state.text;
  colorText.value = state.color;
  colorBg.value   = state.bg;
  fontSelect.value = state.font;
  updatePreview();
}
init();
</script>
</body>
</html>
