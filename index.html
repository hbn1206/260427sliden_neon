<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>응원 문구 LED</title>

<!-- Google Fonts (모바일에서 예쁜 한글 글꼴) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@900&family=Do+Hyeon&family=Jua&family=Gugi&family=Gaegu:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0b0b10; color:#eee;
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  body { overflow-x:hidden; }

  .app { padding: 16px; padding-bottom: 40px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; text-align:center; }
  h1 small { color:#9aa; font-weight:400; font-size:13px; display:block; margin-top:4px; }

  .card { background:#16161e; border:1px solid #262633; border-radius:14px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:#cfd; letter-spacing:.3px; }

  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .seg { display:flex; gap:6px; }
  .seg button {
    flex:1; padding:10px 8px; border-radius:10px; border:1px solid #2c2c3a;
    background:#1d1d29; color:#ddd; font-size:14px; font-weight:600;
  }
  .seg button.on { background:#3b6ef6; border-color:#3b6ef6; color:#fff; }

  .examples { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .examples button {
    padding:12px 10px; border-radius:10px; border:1px solid #2c2c3a;
    background:#1d1d29; color:#ddd; font-size:14px; line-height:1.3;
    text-align:center; min-height:54px;
  }
  .examples button:active { background:#2a2a3a; }

  textarea {
    width:100%; min-height:90px; padding:12px; border-radius:10px;
    border:1px solid #2c2c3a; background:#0f0f17; color:#fff;
    font-size:16px; resize:vertical;
    font-family: inherit;
  }

  label { font-size:13px; color:#bcd; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

  select, input[type="color"], input[type="range"] {
    width:100%; padding:8px; border-radius:8px; border:1px solid #2c2c3a;
    background:#0f0f17; color:#fff; font-size:14px;
    font-family: inherit;
  }
  input[type="color"] { height:44px; padding:2px; }

  /* 미리보기 */
  .preview-wrap { aspect-ratio: 16/9; width:100%; position:relative; border-radius:12px; overflow:hidden; background:#000; }
  .stage {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 4%;
    overflow:hidden;
  }
  .stage .text {
    font-weight: 900;
    line-height: 1.05;
    white-space: pre-wrap;
    word-break: keep-all;
    text-align: center;
    width: 100%;
    text-shadow: 0 0 12px rgba(255,255,255,.1);
  }

  .btn-primary {
    width:100%; padding:16px; border-radius:12px; border:none;
    background: linear-gradient(135deg,#ff5e8a,#7a5cff);
    color:#fff; font-size:17px; font-weight:800; letter-spacing:.5px;
    box-shadow: 0 8px 24px rgba(122,92,255,.35);
  }
  .btn-primary:active { transform: translateY(1px); }

  /* 전체화면 무대 */
  .fullstage {
    position: fixed; inset:0; z-index: 9999;
    background:#000;
    display:none;
    align-items:center; justify-content:center;
    overflow:hidden;
  }
  .fullstage.active { display:flex; }
  .fullstage .text {
    font-weight: 900;
    line-height: 1.0;
    white-space: pre-wrap;
    word-break: keep-all;
    text-align:center;
    width: 100%;
    padding: 0 4vw;
  }

  /* 깜빡임(무지개) - 색상이 바뀌면서 깜빡임 */
  @keyframes rainbowBlink {
    0%   { opacity:1; color:#ff3b3b; }
    24%  { opacity:1; color:#ff3b3b; }
    25%  { opacity:0; }
    26%  { opacity:1; color:#ff8a00; }
    49%  { opacity:1; color:#ff8a00; }
    50%  { opacity:0; }
    51%  { opacity:1; color:#ffd400; }
    61%  { opacity:1; color:#ffd400; }
    62%  { opacity:0; }
    63%  { opacity:1; color:#3ddc84; }
    74%  { opacity:1; color:#3ddc84; }
    75%  { opacity:0; }
    76%  { opacity:1; color:#3aa0ff; }
    87%  { opacity:1; color:#3aa0ff; }
    88%  { opacity:0; }
    89%  { opacity:1; color:#c061ff; }
    100% { opacity:1; color:#c061ff; }
  }
  .fx-rainbowblink { animation: rainbowBlink 2.4s steps(1, end) infinite; }

  /* 고정 */
  .fx-static { /* 그대로 */ }

  /* 도움말 */
  .hint { font-size:12px; color:#88a; margin-top:6px; line-height:1.5; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#22223a; color:#ace; font-size:12px; }

  /* 글꼴 옵션 미리보기용 */
  .font-bhs { font-family: "Black Han Sans", sans-serif; }
  .font-noto { font-family: "Noto Sans KR", sans-serif; font-weight:900; }
  .font-do { font-family: "Do Hyeon", sans-serif; }
  .font-jua { font-family: "Jua", sans-serif; }
  .font-gugi { font-family: "Gugi", sans-serif; }
  .font-gaegu { font-family: "Gaegu", cursive; font-weight:700; }
  .font-pen { font-family: "Nanum Pen Script", cursive; }
</style>
</head>
<body>

<div class="app">
  <h1>📣 응원 문구 LED
    <small>분임 선택 → 문구 입력 → 전체화면</small>
  </h1>

  <!-- 분임 선택 -->
  <div class="card">
    <h2>1. 분임 선택</h2>
    <div class="seg" id="groupSeg">
      <button data-group="edu" class="on">에듀테크AI(고)</button>
      <button data-group="math">수학</button>
    </div>
  </div>

  <!-- 예시 문구 -->
  <div class="card">
    <h2>2. 예시 문구 (탭하면 입력창에 채워집니다)</h2>
    <div class="examples" id="examples"></div>
  </div>

  <!-- 직접 입력 -->
  <div class="card">
    <h2>3. 직접 입력</h2>
    <textarea id="txt" placeholder="응원 문구를 입력하세요"></textarea>
    <div class="hint">줄바꿈도 그대로 반영됩니다.</div>
  </div>

  <!-- 효과 / 색상 / 글꼴 -->
  <div class="card">
    <h2>4. 효과 · 색상 · 글꼴</h2>

    <label>효과</label>
    <div class="seg" id="fxSeg" style="margin:6px 0 12px;">
      <button data-fx="rainbowblink" class="on">🌈 무지개 깜빡임</button>
      <button data-fx="static">⏺ 고정</button>
    </div>

    <div class="grid2">
      <div>
        <label>글자색 <span class="pill">고정 모드에서만 적용</span></label>
        <input type="color" id="fg" value="#ffffff" />
      </div>
      <div>
        <label>배경색</label>
        <input type="color" id="bg" value="#000000" />
      </div>
    </div>

    <div style="margin-top:10px;">
      <label>글꼴</label>
      <select id="fontSel">
        <option value="Black Han Sans" class="font-bhs">Black Han Sans (굵직한 임팩트)</option>
        <option value="Noto Sans KR" selected class="font-noto">Noto Sans KR 900 (기본)</option>
        <option value="Do Hyeon" class="font-do">Do Hyeon (둥근 고딕)</option>
        <option value="Jua" class="font-jua">Jua (통통)</option>
        <option value="Gugi" class="font-gugi">Gugi (캘리그라피)</option>
        <option value="Gaegu" class="font-gaegu">Gaegu (손글씨)</option>
        <option value="Nanum Pen Script" class="font-pen">Nanum Pen Script (펜글씨)</option>
      </select>
    </div>
  </div>

  <!-- 미리보기 -->
  <div class="card">
    <h2>5. 미리보기</h2>
    <div class="preview-wrap" id="previewWrap">
      <div class="stage" id="previewStage">
        <div class="text" id="previewText">에듀테크 AI 최고!!</div>
      </div>
    </div>
    <div class="hint">미리보기에는 전체 문구가 항상 한눈에 보이도록 자동 크기 조절됩니다.</div>
  </div>

  <!-- 전체화면 -->
  <button class="btn-primary" id="goFull">🚀 전체화면으로 보기</button>
  <div class="hint" style="text-align:center; margin-top:8px;">
    전체화면에서는 화면 어디든 한 번 탭하면 이전 설정 화면으로 돌아옵니다.
  </div>
</div>

<!-- 전체화면 무대 -->
<div class="fullstage" id="fullstage">
  <div class="text" id="fullText">에듀테크 AI 최고!!</div>
</div>

<script>
  // ===== 예시 문구 =====
  const EXAMPLES = {
    edu: [
      "에듀테크 AI 최고!!",
      "AI로 미래 교육을\n선도하는 우리!",
      "코딩이 곧 경쟁력!\n에듀테크AI 화이팅!",
      "도전! 열정! 혁신!\n에듀테크AI(고)"
    ],
    math: [
      "수학 분임 화이팅!",
      "문제는 풀라고 있는 것!\n수학 최고!",
      "수학으로 세상을\n읽는 우리!",
      "끈기와 논리!\n수학 분임 파이팅!"
    ]
  };

  // ===== 상태 =====
  const state = {
    group: 'edu',
    fx: 'rainbowblink',
    fg: '#ffffff',
    bg: '#000000',
    font: 'Noto Sans KR',
    text: "에듀테크 AI 최고!!"
  };

  // ===== DOM =====
  const $ = sel => document.querySelector(sel);
  const examplesEl = $('#examples');
  const txt = $('#txt');
  const fg = $('#fg');
  const bg = $('#bg');
  const fontSel = $('#fontSel');
  const previewStage = $('#previewStage');
  const previewText = $('#previewText');
  const previewWrap = $('#previewWrap');
  const fullstage = $('#fullstage');
  const fullText = $('#fullText');

  // ===== 분임 선택 =====
  document.querySelectorAll('#groupSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#groupSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state.group = b.dataset.group;
      renderExamples();
    });
  });

  function renderExamples(){
    examplesEl.innerHTML = '';
    EXAMPLES[state.group].forEach(s=>{
      const btn = document.createElement('button');
      btn.textContent = s;
      btn.addEventListener('click', ()=>{
        txt.value = s;
        state.text = s;
        applyAll();
      });
      examplesEl.appendChild(btn);
    });
  }

  // ===== 효과 선택 =====
  document.querySelectorAll('#fxSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#fxSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state.fx = b.dataset.fx;
      applyAll();
    });
  });

  // ===== 입력 =====
  txt.addEventListener('input', ()=>{ state.text = txt.value || ' '; applyAll(); });
  fg.addEventListener('input', ()=>{ state.fg = fg.value; applyAll(); });
  bg.addEventListener('input', ()=>{ state.bg = bg.value; applyAll(); });
  fontSel.addEventListener('change', ()=>{ state.font = fontSel.value; applyAll(); });

  // ===== 텍스트 자동 크기 (이진 탐색) =====
  function fitText(container, textEl, maxRatio=1.0, minPx=12, maxPx=600){
    const cw = container.clientWidth * 0.96;
    const ch = container.clientHeight * maxRatio;
    let lo = minPx, hi = maxPx, best = minPx;
    textEl.style.fontSize = lo + 'px';
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      textEl.style.fontSize = mid + 'px';
      // 강제 reflow
      const sw = textEl.scrollWidth;
      const sh = textEl.scrollHeight;
      if (sw <= cw && sh <= ch){
        best = mid; lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    textEl.style.fontSize = best + 'px';
    return best;
  }

  // ===== 적용 =====
  function applyEffect(el){
    el.classList.remove('fx-rainbowblink', 'fx-static');
    if (state.fx === 'rainbowblink') el.classList.add('fx-rainbowblink');
    else el.classList.add('fx-static');
  }

  function applyAll(){
    // 미리보기
    previewWrap.style.background = state.bg;
    previewStage.style.background = state.bg;
    previewText.textContent = state.text;
    previewText.style.fontFamily = `"${state.font}", "Noto Sans KR", sans-serif`;
    // 고정 모드는 사용자가 고른 글자색, 무지개 깜빡임은 애니메이션이 색을 제어
    if (state.fx === 'static') previewText.style.color = state.fg;
    else previewText.style.color = ''; // CSS 애니메이션이 색 결정
    applyEffect(previewText);
    // 미리보기 안에 전체 글씨가 보이도록
    requestAnimationFrame(()=> fitText(previewWrap, previewText, 0.92, 12, 400));

    // 전체화면
    fullstage.style.background = state.bg;
    fullText.textContent = state.text;
    fullText.style.fontFamily = `"${state.font}", "Noto Sans KR", sans-serif`;
    if (state.fx === 'static') fullText.style.color = state.fg;
    else fullText.style.color = '';
    applyEffect(fullText);
    if (fullstage.classList.contains('active')){
      requestAnimationFrame(fitFullText);
    }
  }

  // ===== 전체화면 텍스트: 높이 70% 기준 =====
  function fitFullText(){
    // 화면 높이의 70%를 목표로, 가로로 넘치면 줄여서 맞춤
    const cw = fullstage.clientWidth * 0.92;
    const ch = fullstage.clientHeight * 0.70;
    let lo = 20, hi = 1200, best = 20;
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      fullText.style.fontSize = mid + 'px';
      const sw = fullText.scrollWidth;
      const sh = fullText.scrollHeight;
      if (sw <= cw && sh <= ch){
        best = mid; lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    fullText.style.fontSize = best + 'px';
  }

  // ===== 전체화면 진입/복귀 =====
  let wakeLock = null;
  async function requestWakeLock(){
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e){}
  }
  function releaseWakeLock(){
    try { wakeLock && wakeLock.release(); } catch(e){}
    wakeLock = null;
  }

  $('#goFull').addEventListener('click', enterFull);

  function enterFull(){
    fullstage.classList.add('active');
    // 브라우저 전체화면도 함께 시도
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch(e){} }
    requestWakeLock();
    // 다음 프레임에 크기 조절(레이아웃 잡힌 후)
    requestAnimationFrame(()=> {
      fitFullText();
      // 글꼴 로드가 늦을 수 있어 한 번 더
      setTimeout(fitFullText, 60);
      setTimeout(fitFullText, 250);
    });
  }

  function exitFull(){
    fullstage.classList.remove('active');
    if (document.fullscreenElement || document.webkitFullscreenElement){
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) { try { ex.call(document); } catch(e){} }
    }
    releaseWakeLock();
  }

  // 전체화면에서 아무 곳이나 탭하면 복귀
  ['click','touchstart'].forEach(evt=>{
    fullstage.addEventListener(evt, (e)=>{
      e.preventDefault();
      exitFull();
    }, { passive:false });
  });

  // 회전/리사이즈 시 다시 맞춤
  window.addEventListener('resize', ()=>{
    fitText(previewWrap, previewText, 0.92, 12, 400);
    if (fullstage.classList.contains('active')) fitFullText();
  });
  window.addEventListener('orientationchange', ()=>{
    setTimeout(()=>{
      fitText(previewWrap, previewText, 0.92, 12, 400);
      if (fullstage.classList.contains('active')) fitFullText();
    }, 200);
  });

  // 글꼴 로드 완료 후 다시 한 번 맞춤
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      fitText(previewWrap, previewText, 0.92, 12, 400);
      if (fullstage.classList.contains('active')) fitFullText();
    });
  }

  // ===== 초기화 =====
  txt.value = state.text;
  renderExamples();
  applyAll();
</script>
</body>
</html>
